name: Deploy

on:
  push:
    branches: [main, patch-1]
  workflow_dispatch:

# One deploy at a time, and never cancel one that is already uploading.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # The dashboard is the only build artifact; wrangler bundles the Worker
      # from src/worker/index.ts as part of the deploy below.
      - name: Build dashboard and dry-run bundle the Worker
        run: bun run build

      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
